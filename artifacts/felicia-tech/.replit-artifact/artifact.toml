kind = "web"
previewPath = "/"
title = "Felicia Tech"
description = "A gadget online store selling phones and accessories (iPhone, Motorola, rugged handsets). Customers can browse products, view details and customer reviews, add items to a persistent cart, and proceed to checkout. The app is built for Felicia Tech, a gadget retailer."
version = "1.0.0"
id = "artifacts/felicia-tech"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24919

[services.development]
run = "pnpm --filter @workspace/felicia-tech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/felicia-tech", "run", "build" ]
serve = "static"
publicDir = "artifacts/felicia-tech/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24919"
BASE_PATH = "/"
