[build]
  # Build the frontend from the pnpm workspace.
  # Netlify auto-detects pnpm via pnpm-lock.yaml and runs `pnpm install` first.
  command = "pnpm --filter @workspace/felicia-tech run build"
  publish = "artifacts/felicia-tech/dist/public"

[build.environment]
  # Required by the Vite config. "/" for a root-hosted Netlify site.
  BASE_PATH = "/"
  # Tell Vite it's a production build
  NODE_ENV = "production"
  # Pin Node version to match the development environment
  NODE_VERSION = "20"

# Proxy /api/* to the Replit API server.
# This rule must come BEFORE the SPA catch-all below so Netlify doesn't
# serve index.html for API requests.
[[redirects]]
  from = "/api/*"
  to = "https://felicia-shop-central--temitopeagbor12.replit.app/api/:splat"
  status = 200
  force = true

# SPA fallback — send all non-file requests to index.html so client-side
# routing works on page refresh and direct URL entry.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
